spring.application.name=youth-event-platform

server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:youth_event}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
# Dev only (skipped with the prod profile; set DB_CREATE_IF_MISSING=false in production): create the database above if it does not exist yet
app.database.create-if-missing=${DB_CREATE_IF_MISSING:true}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Images uploaded from the admin panel; served under /uploads/
app.upload-dir=${UPLOAD_DIR:uploads}
# Built-in content images under /media/ (src/main/resources/static/media)
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

spring.jackson.time-zone=Asia/Tehran

spring.cache.type=simple

sms.provider=${SMS_PROVIDER:kavenegar}
sms.dev-code=${SMS_DEV_CODE:1111}
sms.kavenegar.api-key=${KAVENEGAR_API_KEY:}
sms.kavenegar.otp-template=${KAVENEGAR_OTP_TEMPLATE:otp}

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=INFO
logging.level.com.devs.nisha=${APP_LOG_LEVEL:DEBUG}

# Sample data matching the UI designs, loaded once per seed version (never runs with the prod profile).
# Set DEMO_SEED_ENABLED=false in production and to keep your own local data untouched.
demo.seed.enabled=${DEMO_SEED_ENABLED:true}

# Payment: "dev" completes payments locally (for development only), "none" until a real gateway is integrated (use none in production).
payment.mode=${PAYMENT_MODE:dev}
