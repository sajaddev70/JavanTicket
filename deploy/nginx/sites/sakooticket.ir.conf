# sakooticket.ir: main website (user site, including the account pages) + API, uploads and built-in media.
# Installed to /etc/nginx/sites-available/sakooticket.ir.conf by deploy/setup-nginx.sh.
#
#   /api/      -> backend (Spring Boot)   API used by the site, the admin panel and the Android apps
#   /uploads/  -> backend                 images uploaded from the admin panel
#   /media/    -> backend                 built-in content images
#   /          -> user site (Next.js)     every page, including direct loads of inner routes
#
# Swagger/OpenAPI is deliberately not proxied (and disabled in production).

server {
    listen 80;
    server_name sakooticket.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://sakooticket.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sakooticket.ir;

    include snippets/sakooticket-ssl.conf;
    include snippets/sakooticket-security-headers.conf;
    include snippets/sakooticket-proxy.conf;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

    server_tokens off;
    access_log /var/log/nginx/sakooticket.ir.access.log;
    error_log  /var/log/nginx/sakooticket.ir.error.log warn;

    # Admin uploads are sent to this host's API; the backend's own limit is 50MB.
    client_max_body_size 60m;

    location ~ /\.(?!well-known/) {
        return 404;
    }

    # ---------- backend ----------
    location ^~ /api/ {
        proxy_pass http://sakooticket_backend;
    }

    location ^~ /uploads/ {
        proxy_pass http://sakooticket_backend;
        proxy_cache sakooticket_static;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    }

    location ^~ /media/ {
        proxy_pass http://sakooticket_backend;
        proxy_cache sakooticket_static;
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    }

    # ---------- user site ----------
    # Build-hashed assets (Cache-Control: immutable from Next.js).
    location ^~ /_next/static/ {
        proxy_pass http://sakooticket_user;
        proxy_cache sakooticket_static;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    }

    location / {
        proxy_pass http://sakooticket_user;
    }
}
