# adm.sakooticket.ir: admin panel (frontend/admin, served under /admin).
# Installed to /etc/nginx/sites-available/adm.sakooticket.ir.conf by deploy/setup-nginx.sh.
#
# The panel calls the API on https://sakooticket.ir/api/v1 (PUBLIC_API_URL); that origin must be listed in
# CORS_ALLOWED_ORIGINS. Access control is enforced by the backend (ROLE_ADMIN + per-role permissions), not here.

server {
    listen 80;
    server_name adm.sakooticket.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://adm.sakooticket.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name adm.sakooticket.ir;

    include snippets/sakooticket-ssl.conf;
    include snippets/sakooticket-security-headers.conf;
    include snippets/sakooticket-proxy.conf;
    # The gate control page scans tickets with the camera.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    server_tokens off;
    access_log /var/log/nginx/adm.sakooticket.ir.access.log;
    error_log  /var/log/nginx/adm.sakooticket.ir.error.log warn;

    # Uploads go to the API host (sakooticket.ir), not here.
    client_max_body_size 10m;

    location ~ /\.(?!well-known/) {
        return 404;
    }

    # The bare host lands on the panel.
    location = / {
        return 302 https://adm.sakooticket.ir/admin;
    }

    # Build-hashed assets (Cache-Control: immutable from Next.js).
    location ^~ /admin/_next/static/ {
        proxy_pass http://sakooticket_admin;
        proxy_cache sakooticket_static;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    }

    location / {
        proxy_pass http://sakooticket_admin;
    }
}
