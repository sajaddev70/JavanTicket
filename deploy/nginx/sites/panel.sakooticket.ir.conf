# panel.sakooticket.ir: user panel entry point.
# Installed to /etc/nginx/sites-available/panel.sakooticket.ir.conf by deploy/setup-nginx.sh.
#
# The user panel (login, profile, tickets, orders) is part of the user site (frontend/user, routes /login and
# /profile), so this host sends visitors there instead of running a second copy of the site:
#   - the login session lives in per-origin browser storage, so a second origin would mean a second, separate login;
#   - payment gateways return the buyer to PUBLIC_USER_SITE_URL (sakooticket.ir); a buyer who paid from panel.*
#     would come back logged out.
# Temporary (302) redirects, so browsers do not cache the target and this host can later serve a separate panel.

server {
    listen 80;
    server_name panel.sakooticket.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://panel.sakooticket.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name panel.sakooticket.ir;

    include snippets/sakooticket-ssl.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex" always;

    server_tokens off;
    access_log /var/log/nginx/panel.sakooticket.ir.access.log;
    error_log  /var/log/nginx/panel.sakooticket.ir.error.log warn;

    # The account pages; the user site sends visitors who are not logged in to /login and back afterwards.
    location = / {
        return 302 https://sakooticket.ir/profile;
    }

    # Deep links keep their path, e.g. panel.sakooticket.ir/profile/tickets -> sakooticket.ir/profile/tickets.
    location / {
        return 302 https://sakooticket.ir$request_uri;
    }
}
