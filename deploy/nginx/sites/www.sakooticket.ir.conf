# www.sakooticket.ir: permanent redirect to the canonical host sakooticket.ir.
# Installed to /etc/nginx/sites-available/www.sakooticket.ir.conf by deploy/setup-nginx.sh.

server {
    listen 80;
    server_name www.sakooticket.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://sakooticket.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.sakooticket.ir;

    include snippets/sakooticket-ssl.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;
    access_log /var/log/nginx/www.sakooticket.ir.access.log;
    error_log  /var/log/nginx/www.sakooticket.ir.error.log warn;

    return 301 https://sakooticket.ir$request_uri;
}
