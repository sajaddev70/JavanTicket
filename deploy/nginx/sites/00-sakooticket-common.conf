# Shared definitions for the sakooticket hosts (http context).
# Installed to /etc/nginx/sites-available/00-sakooticket-common.conf by deploy/setup-nginx.sh.
#
# The docker compose services listen on loopback only (see docker-compose.yml); nginx is the single public entry point.
# If you change BACKEND_PORT / ADMIN_PORT / USER_PORT in .env, change the ports here too.

upstream sakooticket_user    { server 127.0.0.1:3001; keepalive 32; }
upstream sakooticket_admin   { server 127.0.0.1:3000; keepalive 32; }
upstream sakooticket_backend { server 127.0.0.1:8080; keepalive 32; }

# "upgrade" for WebSocket requests, empty otherwise so upstream keep-alive connections are reused.
map $http_upgrade $sakooticket_connection_upgrade {
    default upgrade;
    ''      '';
}

# Small cache for public, content-addressed assets only (/_next/static, /media, /uploads).
# API responses and pages are never cached by nginx.
proxy_cache_path /var/cache/nginx/sakooticket levels=1:2 keys_zone=sakooticket_static:20m max_size=1g inactive=7d use_temp_path=off;

# ---------- ArvanCloud CDN (only if its proxy mode is turned on) ----------
