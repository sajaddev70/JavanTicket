# Reverse-proxy settings shared by the sakooticket HTTPS hosts.
# Installed to /etc/nginx/snippets/sakooticket-proxy.conf by deploy/setup-nginx.sh.
#
# Include at server level only. nginx drops inherited proxy_set_header directives in any location that declares
# its own, so locations in the sakooticket configs never use proxy_set_header.

proxy_http_version 1.1;

# Keep-alive to the upstreams, and WebSocket upgrades when a client asks for one
# ($sakooticket_connection_upgrade is defined in 00-sakooticket-common.conf).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $sakooticket_connection_upgrade;

proxy_set_header Host              $host;
# The backend logs the first X-Forwarded-For value, so a client-supplied value is never passed on.
# Visitors are assumed to connect directly; if the ArvanCloud CDN proxy is turned on, enable the real_ip
# lines in 00-sakooticket-common.conf so $remote_addr becomes the visitor's address again.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  443;

proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# Next.js sends large response headers.
proxy_buffer_size 16k;
proxy_buffers     8 16k;
proxy_busy_buffers_size 32k;
