# TLS for every sakooticket host: one Let's Encrypt SAN certificate covering
# sakooticket.ir, www.sakooticket.ir, panel.sakooticket.ir and adm.sakooticket.ir.
# Installed to /etc/nginx/snippets/sakooticket-ssl.conf by deploy/setup-nginx.sh.
# Mozilla "intermediate" profile: TLS 1.2 + 1.3, forward-secret AEAD ciphers only.

ssl_certificate     /etc/letsencrypt/live/sakooticket.ir/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/sakooticket.ir/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_cache   shared:sakooticket_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
