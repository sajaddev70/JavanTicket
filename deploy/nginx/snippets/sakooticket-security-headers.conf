# Security headers for every HTTPS sakooticket host.
# Installed to /etc/nginx/snippets/sakooticket-security-headers.conf by deploy/setup-nginx.sh.
#
# Include at server level only. nginx drops inherited add_header directives in any location that declares its own,
# so locations in the sakooticket configs never use add_header.
# Permissions-Policy differs per host (the admin gate control uses the camera) and is set in each server block.

# The same headers from the apps are hidden so each one is sent exactly once.
proxy_hide_header X-Powered-By;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-XSS-Protection;

# One year, this host only (no includeSubDomains, so other subdomains are not forced onto HTTPS).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
