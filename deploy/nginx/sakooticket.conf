# sakooticket.ir: host nginx in front of the docker compose services.
#
#   sakooticket.ir        user site, plus /api, /uploads and /media from the backend
#   www.sakooticket.ir    redirects to sakooticket.ir
#   panel.sakooticket.ir  redirects to the user account pages on sakooticket.ir
#   adm.sakooticket.ir    admin panel
#
# The certificate must exist before nginx accepts this file; deploy/setup-nginx.sh handles that order.
# Swagger is deliberately not proxied, so the API docs stay private.
# IPv4 only: the domain has A records, and listening on [::] makes nginx fail on servers with IPv6 disabled.

upstream javan_user    { server 127.0.0.1:3003; keepalive 32; }
upstream javan_admin   { server 127.0.0.1:3002; keepalive 32; }
upstream javan_backend { server 127.0.0.1:8081; keepalive 32; }

# ---------- HTTP: certificate challenges, everything else goes to HTTPS ----------
server {
    listen 80;
    server_name sakooticket.ir www.sakooticket.ir panel.sakooticket.ir adm.sakooticket.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- www -> apex ----------
server {
    listen 443 ssl http2;
    server_name www.sakooticket.ir;

    ssl_certificate     /etc/letsencrypt/live/sakooticket.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakooticket.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:javan_ssl:10m;
    ssl_session_timeout 1d;

    return 301 https://sakooticket.ir$request_uri;
}

# ---------- panel -> account pages on the apex ----------
# One origin keeps logins, the PWA and the payment return address (PUBLIC_USER_SITE_URL) in one place:
# sessions live in per-origin browser storage, so a buyer paying on panel.* would come back logged out.
# Temporary redirects, so this can later point at a separate panel without browsers caching the old target.
server {
    listen 443 ssl http2;
    server_name panel.sakooticket.ir;

    ssl_certificate     /etc/letsencrypt/live/sakooticket.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakooticket.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:javan_ssl:10m;
    ssl_session_timeout 1d;

    location = / {
        return 302 https://sakooticket.ir/profile;
    }

    location / {
        return 302 https://sakooticket.ir$request_uri;
    }
}

# ---------- user site + API ----------
server {
    listen 443 ssl http2;
    server_name sakooticket.ir;

    ssl_certificate     /etc/letsencrypt/live/sakooticket.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakooticket.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:javan_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=2592000" always;

    # Admin uploads go through this host; the backend's own limit is 50MB.
    client_max_body_size 60m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The backend logs the first X-Forwarded-For value, so a client-supplied value must not be passed on.
    # This assumes visitors connect directly. If the ArvanCloud CDN proxy is turned on, $remote_addr becomes
    # an Arvan address and real_ip settings are needed here.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Next.js sends large response headers.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    location ^~ /api/     { proxy_pass http://javan_backend; }
    location ^~ /uploads/ { proxy_pass http://javan_backend; }
    location ^~ /media/   { proxy_pass http://javan_backend; }

    location / {
        proxy_pass http://javan_user;
    }
}

# ---------- admin panel ----------
server {
    listen 443 ssl http2;
    server_name adm.sakooticket.ir;

    ssl_certificate     /etc/letsencrypt/live/sakooticket.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakooticket.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:javan_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # The app lives under /admin and redirects the bare host there itself.
    location / {
        proxy_pass http://javan_admin;
    }
}
