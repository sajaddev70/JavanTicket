server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

spring.application.name=youth-event-platform

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:youth_event}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jackson.time-zone=Asia/Tehran

spring.cache.type=simple

sms.provider=${SMS_PROVIDER:kavenegar}
sms.dev-code=${SMS_DEV_CODE:1111}
sms.kavenegar.api-key=${KAVENEGAR_API_KEY:}
sms.kavenegar.otp-template=${KAVENEGAR_OTP_TEMPLATE:otp}

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=INFO
logging.level.com.youthevent=DEBUG
